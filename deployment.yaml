apiVersion: apps/v1
kind: Deployment
metadata:
  name: novatech-app
  namespace: production
  labels:
    app: novatech
    component: backend
    version: "2.4.1"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: novatech
      component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: novatech
        component: backend
        version: "2.4.1"
    spec:
      serviceAccountName: novatech-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: app
          image: novatech/pulsetrack:2.4.1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: novatech-db-secret
                  key: host
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novatech-db-secret
                  key: password
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: novatech-api-secret
                  key: key
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      imagePullSecrets:
        - name: registry-secret
